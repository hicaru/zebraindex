[package]
name = "zrag-embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
regex.workspace = true
tracing.workspace = true
tokio.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
tokenizers.workspace = true
hf-hub.workspace = true
zrag-hw.workspace = true
zrag-common.workspace = true
zrag-remote-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true
arrow.workspace = true
arrow-array.workspace = true

[features]
default = []
cuda  = [
  "candle-core/cuda",
  "candle-nn/cuda",
  "candle-transformers/cuda",
  "zrag-hw/cuda",
]
metal = [
  "candle-core/metal",
  "candle-nn/metal",
  "candle-transformers/metal",
  "zrag-hw/metal",
]
# Accelerate.framework (macOS) BLAS backend for candle's CPU matmuls.
accelerate = [
  "candle-core/accelerate",
  "candle-nn/accelerate",
  "candle-transformers/accelerate",
]
# Intel oneMKL BLAS backend for candle's CPU matmuls (mutually exclusive with
# `accelerate`; pick the one matching the host platform).
mkl = [
  "candle-core/mkl",
  "candle-nn/mkl",
  "candle-transformers/mkl",
]
# cuDNN fused kernels on top of the `cuda` backend (cuBLAS stays as the fallback).
cudnn = ["cuda", "candle-core/cudnn"]
clap  = ["dep:clap"]

[dependencies.clap]
workspace = true
optional = true
